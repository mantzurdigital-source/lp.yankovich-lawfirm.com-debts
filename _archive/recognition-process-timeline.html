<div class="process reveal" aria-label="שלבי ההליך מול נושים">
  <div class="process__row">
    <div class="process__track" aria-hidden="true"><span class="process__track-fill" data-track-fill></span></div>
    <div class="process__list">
      <div class="process__item">
        <button type="button" class="process-card" data-flip aria-expanded="false" aria-controls="pcBack1">
          <span class="process-card__step">1</span>
          <span class="process-card__inner">
            <span class="process-card__page" id="pcBack1">

              <p class="process-card__page-body">החוב קיים מול הבנק או הנושה, בלי הליכים משפטיים — לרוב עם 1–3 התראות בטלפון או במכתב.</p>
              <p class="process-card__page-action"><strong>אפשר לפעול:</strong> תשלום מלא/חלקי, סידור מול הנושה, או ייעוץ פיננסי מוקדם.</p>
              <p class="process-card__page-note"><strong>חשוב לדעת:</strong> בלי טיפול בשלב הזה, הנושה ממשיך להליך הבא.</p>
            </span>

      </div>
      <div class="process__item">

              <p class="process-card__page-action"><strong>אפשר לפעול:</strong> בקשה לפריסת החוב, שיקום כלכלי, או הליך חדלות פירעון.</p>

      <div class="process__item">

            <span class="process-card__page" id="pcBack5">
              <span class="process-card__page-status">הליך משפטי רשמי</span>
              <p class="process-card__page-body">מינוי נאמן, הקפאת הליכי גבייה, ובחינת נכסים וחובות בבית המשפט.</p>
              <p class="process-card__page-action"><strong>אפשר לפעול:</strong> עצירת הגבייה, הסדרת כלל החובות, והתחלה כלכלית חדשה.</p>

            </span>
            <span class="process-card__cover">

      <div class="process__item">

              <span class="process-card__label">נקודת האל־חזור</span>

</div>

<style>
.process { margin-bottom: 44px; }
.process__row { position: relative; }
.process__row + .process__row { margin-top: 40px; }
.process__track {
  position: absolute;
  top: 34px;
  left: 16.66%;
  right: 16.66%;
  height: 3px;
  background: var(--gray-200);
  border-radius: 2px;
  overflow: hidden;
  z-index: 0;
}
.process__track-fill {
  display: block;
  width: var(--fill, 0%);
  height: 100%;
  background: linear-gradient(90deg, var(--gold) 0%, var(--gold-d) 100%);
  transition: width 0.9s var(--ease);
}
.process__list {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
.process__item { display: flex; justify-content: center; }

.process-card {
  display: block;
  position: relative;
  width: 100%;
  max-width: 260px;
  padding: 0;
  border: none;
  background: none;
  cursor: pointer;
  perspective: 1600px;
  text-align: center;
}
.process-card__step {
  position: absolute;
  top: -14px;
  right: 50%;
  transform: translateX(50%);
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--gold);
  color: var(--white);
  font-weight: 800;
  font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 10px rgba(166, 130, 79, 0.35);
  z-index: 2;
}
.process-card__inner {
  display: block;
  position: relative;
  min-height: 272px;
  transform-style: preserve-3d;
}

/* the "page" — sits flush behind the cover, always in place */
.process-card__page {
  display: flex;
  position: absolute;
  inset: 0;
  border-radius: var(--radius-md);
  background: var(--navy);
  box-shadow: var(--shadow-card);
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 10px;
  padding: 26px 22px;
  text-align: right;
}
.process-card__page-status {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--gold-l);
  background: rgba(243, 236, 221, 0.12);
  border-radius: 999px;
  padding: 4px 10px;
}
.process-card__page-body { color: var(--gray-200); font-size: 13px; line-height: 1.6; }
.process-card__page-action { color: var(--white); font-size: 12.5px; line-height: 1.55; }
.process-card__page-action strong { color: var(--gold-l); }
.process-card__page-note { color: var(--gray-400); font-size: 11.5px; line-height: 1.5; }
.process-card__page-note strong { color: var(--gray-200); }

/* the "cover" — rests ajar on its spine (right edge, matching Hebrew page-turn direction)
   so the closed state already reads as "half-open, click to reveal" rather than a flat card */
.process-card__cover {
  display: flex;
  position: absolute;
  inset: 0;
  border-radius: var(--radius-md);
  background: var(--white);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 30px 20px;
  transform-style: preserve-3d;
  transform-origin: right center;
  transform: rotateY(24deg);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow:
    var(--shadow-card),
    10px 4px 18px -6px rgba(20, 33, 61, 0.35);
  transition: transform 0.6s var(--ease), box-shadow 0.6s var(--ease);
}
.process-card__cover::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius-md);
  background: linear-gradient(to left, rgba(20, 33, 61, 0.14), transparent 40%);
  pointer-events: none;
}
.process-card:hover .process-card__cover {
  transform: rotateY(32deg);
  box-shadow:
    var(--shadow-card),
    14px 6px 22px -6px rgba(20, 33, 61, 0.4);
}
.process-card[aria-expanded="true"] .process-card__cover {
  transform: rotateY(155deg);
  box-shadow: var(--shadow-card);
}
.process-card[aria-expanded="true"] .process-card__cover::before { opacity: 0; }

.process-card__ico {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--gold-l);
  color: var(--gold-d);
  display: flex; align-items: center; justify-content: center;
}
.process-card__ico svg { width: 21px; height: 21px; }
.process-card__label { font-size: 14.5px; font-weight: 700; color: var(--navy-2); }
.process-card__hint { font-size: 12px; color: var(--gray-400); }

@media (prefers-reduced-motion: reduce) {
  .process-card__cover, .process__track-fill { transition-duration: 0.01ms; }
}

@media (max-width: 640px) {
  .process__list { grid-template-columns: 1fr; gap: 44px; }
  .process__track {
    top: 0; bottom: 0; left: 50%; right: auto;
    width: 3px; height: auto;
    transform: translateX(50%);
  }
  .process__track-fill { width: 100%; height: var(--fill, 0%); transition: height 0.9s var(--ease); }
  .process-card { max-width: 280px; margin: 0 auto; }
}
</style>

<script>
// Process timeline — each row's connecting line fills as its steps scroll into view; cards flip on click
const processEl = document.querySelector('.process');
if (processEl) {
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  processEl.querySelectorAll('.process__row').forEach((row) => {
    const track = row.querySelector('[data-track-fill]');
    const items = row.querySelectorAll('.process__item');
    if (!track || !items.length) return;

    if (prefersReducedMotion || !('IntersectionObserver' in window)) {
      track.style.setProperty('--fill', '100%');
    } else {
      const total = items.length;
      const itemsArr = Array.from(items);
      const trackIo = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            const idx = itemsArr.indexOf(entry.target);
            track.style.setProperty('--fill', `${((idx + 1) / total) * 100}%`);
            trackIo.unobserve(entry.target);
          }
        });
      }, { threshold: 0.5 });
      itemsArr.forEach((el) => trackIo.observe(el));
    }
  });

  processEl.querySelectorAll('[data-flip]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!open));
    });
  });
}
</script>
